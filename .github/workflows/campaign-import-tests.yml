name: Wordstat campaign import checks
on:
  pull_request:
    paths:
      - 'ui2027_bot.py'
      - 'campaigns_wordstat.py'
      - 'tests/**'
      - '.github/workflows/campaign-import-tests.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile dashboard and importer
        run: python -m py_compile ui2027_bot.py campaigns_wordstat.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
